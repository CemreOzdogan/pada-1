[workspace]
resolver = "2"
members = [
    "pqc-ml-kem-rustcrypto",
    "pqc-ml-dsa-rustcrypto",
    "pqc-ml-kem-libcrux",
    "pqc-ml-dsa-libcrux",
    "pqc-cli",
]

# pqc-contracts, pqc-reference, pqc-generic are parked, not deleted:
# future work for non-standard-parameter exploration and generic-vs-reference
# benchmarking. Excluded from the workspace so they don't need to compile.
exclude = [
    "pqc-contracts",
    "pqc-reference",
    "pqc-generic",
]

[workspace.package]
edition = "2021"
version = "0.1.0"

[profile.release]
opt-level = 3
