[workspace]
resolver = "2"
members = [
    "pqc-ml-kem-rustcrypto",
    "pqc-ml-dsa-rustcrypto",
    "pqc-ml-kem-libcrux",
    "pqc-ml-dsa-libcrux",
    "pqc-cli",
    "pqc-contracts",
    "pqc-generic",
]

# pqc-reference is parked, not deleted: future work for generic-vs-reference
# benchmarking. Excluded from the workspace so it doesn't need to compile.
exclude = [
    "pqc-reference",
]

[workspace.package]
edition = "2021"
version = "0.1.0"

[profile.release]
opt-level = 3
