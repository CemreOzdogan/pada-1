[package]
name = "pqc-generic"
edition = "2021"
version = "0.1.0"

[dependencies]
getrandom = { version = "0.4.3", features = ["std"] }
pqc-contracts = { version = "0.1.0", path = "../pqc-contracts" }
sha3 = "0.11.0"

# Only used by the byte-exact FIPS 204 conformance test (dilithium.rs's fips204_conformance
# module) — cross-checks this crate's custom ML-DSA engine against two independent, spec-facing
# implementations for the 3 standard parameter sets. Never used outside #[cfg(test)].
[dev-dependencies]
ml-dsa = { version = "0.1.1", features = ["getrandom"] }
libcrux-ml-dsa = "0.0.10"
